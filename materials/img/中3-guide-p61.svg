<text x="560" y="85" font-size="20" fill="#333">……</text><text x="640" y="70" font-size="15" font-weight="bold">Level-wise growth（層級式）</text><text x="640" y="92" font-size="13" fill="#444">同一深度的葉子節點同時分裂，</text><text x="640" y="110" font-size="13" fill="#444">樹橫向擴展</text>
